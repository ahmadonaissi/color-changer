<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Color Changer - Scanner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="mobile-app">
    <div class="mobile-header">
      <h1>Color Scanner</h1>
      <span class="conn-badge" id="connBadge">Connecting...</span>
    </div>

    <div class="mobile-body">
      <div class="mobile-colors" id="mobileColors">
        <div class="color-slot" data-index="0">
          <span>1</span>
          <span class="label">Primary</span>
          <button class="remove">&times;</button>
        </div>
        <div class="color-slot" data-index="1">
          <span>2</span>
          <span class="label">Secondary</span>
          <button class="remove">&times;</button>
        </div>
        <div class="color-slot" data-index="2">
          <span>3</span>
          <span class="label">Accent</span>
          <button class="remove">&times;</button>
        </div>
      </div>

      <div class="mobile-camera" id="mobileCamera">
        <video id="mobileVideo" autoplay playsinline muted></video>
        <canvas id="mobileOverlay"></canvas>
        <div class="tap-hint">Tap to pick a color</div>
      </div>

      <input type="text" class="mobile-name-input" id="mobilePieceName" placeholder="Piece name (e.g. T-Shirt Summer)">

      <div class="mobile-preview" id="mobilePreview">
        <img id="mobilePreviewImg">
      </div>
    </div>

    <div class="mobile-footer">
      <button class="btn-secondary" id="mobileUploadBtn">
        Upload Image
      </button>
      <button class="btn-primary" id="mobileSubmitBtn" disabled>
        Submit
      </button>
    </div>

    <input type="file" id="mobileImageInput" accept="image/*" capture="environment" style="display:none">
  </div>

  <div class="toast" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/mobile.js"></script>
</body>
</html>
